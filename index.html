<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alerta Shows Michael</title>

<style>
body{
  background:#000;
  color:white;
  font-family:Arial, sans-serif;
  padding:15px;
  text-align:center;
}

h1{
  color:#00ff66;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:20px;
  background:#111;
}

th{
  background:#222;
  color:#00ff66;
  padding:10px;
  border:1px solid #00ff66;
}

td{
  padding:10px;
  border:1px solid #555;
}

.hoje{
  background:#00ff66 !important;
  color:#000;
  font-weight:bold;
  animation:piscar 1s infinite;
}

.agendado{
  color:#ffd700;
}

.realizado{
  color:#aaa;
}

@keyframes piscar{
  0%{opacity:1;}
  50%{opacity:.5;}
  100%{opacity:1;}
}

.alerta{
  margin-top:20px;
  font-size:24px;
  font-weight:bold;
  color:#00ff66;
}

input, button{
  padding:10px;
  margin:5px;
  border:none;
  border-radius:5px;
  font-weight:bold;
}

button{
  background:#00ff66;
  color:#000;
}
</style>
</head>

<body>

<h1>🎤 ALERTA SHOWS MICHAEL JACKSON</h1>
<div class="alerta" id="alerta"></div>

<div>
  <input type="date" id="novaData" min="2026-05-01" max="2026-05-31">
  <input type="time" id="novaHora" value="21:00">
  <button onclick="adicionarDataExtra()">➕ Adicionar Data Extra</button>
</div>

<table>
<thead>
<tr>
  <th>Data</th>
  <th>Dia</th>
  <th>Show</th>
  <th>Status</th>
</tr>
</thead>
<tbody id="tabela"></tbody>
</table>

<script>
let showsMichael = JSON.parse(localStorage.getItem("showsMichaelMaio2026")) || [
  {data:"2026-05-01", hora:"21:00", show:"Especial Michael Jackson Tributo"},
  {data:"2026-05-04", hora:"21:00", show:"Michael Jackson | Tributo"},
  {data:"2026-05-05", hora:"21:00", show:"Michael Jackson | Tributo"},
  {data:"2026-05-08", hora:"21:00", show:"Especial Michael Jackson Tributo"},
  {data:"2026-05-11", hora:"21:00", show:"Michael Jackson | Tributo"},
  {data:"2026-05-12", hora:"21:00", show:"Michael Jackson | Tributo"},
  {data:"2026-05-15", hora:"21:00", show:"Especial Michael Jackson Tributo"},
  {data:"2026-05-18", hora:"21:00", show:"Michael Jackson | Tributo"},
  {data:"2026-05-19", hora:"21:00", show:"Michael Jackson | Tributo"},
  {data:"2026-05-22", hora:"21:00", show:"Especial Michael Jackson Tributo"},
  {data:"2026-05-25", hora:"21:00", show:"Michael Jackson | Tributo"},
  {data:"2026-05-26", hora:"21:00", show:"Michael Jackson | Tributo"},
  {data:"2026-05-29", hora:"21:00", show:"Especial Michael Jackson Tributo"}
];

function diaSemana(data){
  const dias = ["Domingo","Segunda","Terça","Quarta","Quinta","Sexta","Sábado"];
  const d = new Date(data + "T00:00:00");
  return dias[d.getDay()];
}

function renderizar(){
  const hoje = new Date().toISOString().split("T")[0];
  const tabela = document.getElementById("tabela");
  const alerta = document.getElementById("alerta");

  tabela.innerHTML = "";
  let temShowHoje = false;

  showsMichael.sort((a,b)=>a.data.localeCompare(b.data));

  showsMichael.forEach(item=>{
    let status = "Agendado";
    let classe = "agendado";

    if(item.data === hoje){
      status = "🟢 HOJE TEM SHOW";
      classe = "hoje";
      temShowHoje = true;
    } else if(item.data < hoje){
      status = "Realizado";
      classe = "realizado";
    }

    tabela.innerHTML += `
      <tr class="${classe}">
        <td>${item.data.split("-").reverse().join("/")} - ${item.hora}</td>
        <td>${diaSemana(item.data)}</td>
        <td>${item.show}</td>
        <td>${status}</td>
      </tr>
    `;
  });

  alerta.innerHTML = temShowHoje 
    ? "🟢 HOJE TEM SHOW MICHAEL JACKSON!"
    : "⚪ Nenhum show Michael hoje";
}

function adicionarDataExtra(){
  const data = document.getElementById("novaData").value;
  const hora = document.getElementById("novaHora").value;

  if(!data){
    alert("Escolha uma data de maio de 2026.");
    return;
  }

  showsMichael.push({
    data:data,
    hora:hora,
    show:"Data Extra | Michael Jackson Tributo"
  });

  localStorage.setItem("showsMichaelMaio2026", JSON.stringify(showsMichael));

  document.getElementById("novaData").value = "";
  document.getElementById("novaHora").value = "21:00";

  renderizar();
}

renderizar();
</script>

</body>
</html>
